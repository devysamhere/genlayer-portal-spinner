<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GenLayer Portal Spinner</title>

  <link rel="stylesheet" href="spinner.css">
</head>

<body>

  <main class="showcase">

    <header class="showcase__header">
      <p class="eyebrow">GENLAYER COMMUNITY</p>
      <h1>Portal Loading Spinner</h1>
      <p class="subtitle">
        A lightweight loading animation designed for the GenLayer Portal.
      </p>
    </header>

    <section class="preview-grid">

      <!-- DARK BACKGROUND -->
      <div class="preview preview--dark">
        <span class="preview__label">Dark</span>

        <div
          class="genlayer-spinner"
          role="status"
          aria-label="Loading"
        >
          <div class="genlayer-spinner__ring">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <img
            class="genlayer-spinner__logo"
            src="genlayer-logo.svg"
            alt=""
          >
        </div>
      </div>

      <!-- LIGHT BACKGROUND -->
      <div class="preview preview--light">
        <span class="preview__label">Light</span>

        <div
          class="genlayer-spinner"
          role="status"
          aria-label="Loading"
        >
          <div class="genlayer-spinner__ring">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <img
            class="genlayer-spinner__logo"
            src="genlayer-logo.svg"
            alt=""
          >
        </div>
      </div>

    </section>


    <!-- SIZE TEST -->

    <section class="sizes">

      <h2>Designed for every loading state</h2>

      <div class="size-row">

        <!-- 24PX -->
        <div class="size-demo">
          <div class="genlayer-spinner genlayer-spinner--24">
            <div class="genlayer-spinner__ring">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>

            <img
              class="genlayer-spinner__logo"
              src="genlayer-logo.svg"
              alt=""
            >
          </div>

          <span>24px</span>
        </div>


        <!-- 32PX -->
        <div class="size-demo">
          <div class="genlayer-spinner genlayer-spinner--32">
            <div class="genlayer-spinner__ring">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>

            <img
              class="genlayer-spinner__logo"
              src="genlayer-logo.svg"
              alt=""
            >
          </div>

          <span>32px</span>
        </div>


        <!-- 48PX -->
        <div class="size-demo">
          <div class="genlayer-spinner genlayer-spinner--48">
            <div class="genlayer-spinner__ring">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>

            <img
              class="genlayer-spinner__logo"
              src="genlayer-logo.svg"
              alt=""
            >
          </div>

          <span>48px</span>
        </div>


        <!-- 64PX -->
        <div class="size-demo">
          <div class="genlayer-spinner genlayer-spinner--64">
            <div class="genlayer-spinner__ring">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>

            <img
              class="genlayer-spinner__logo"
              src="genlayer-logo.svg"
              alt=""
            >
          </div>

          <span>64px</span>
        </div>

      </div>

    </section>

  </main>

</body>
</html>
